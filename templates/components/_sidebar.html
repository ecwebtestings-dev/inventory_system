    <span class="brand-mark">S</span>
    <span>SOLVER <b>UGANDA</b></span>
  </a>

  <div class="sidebar-section-label">WORKSPACE</div>

      <span class="nav-symbol"></span> Dashboard</a>

  <div class="sidebar-bottom">

      <span class="user-avatar">{{ session.get('user_name', 'A')[0]|upper }}</span>
