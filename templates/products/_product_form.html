
<div class="form-grid">
    <label class="form-field full-width">
        Product name
        <input
            type="text"
            name="product_name"
            id="product_name"
            maxlength="100"
            placeholder="Enter product name"
            required
        >
    </label>

    <label class="form-field">
        Category
        <input
            type="text"
            name="category"
            id="category"
            maxlength="50"
            placeholder="e.g Electronics"
            required
        >
    </label>

    <label class="form-field">
        Supplier
        <input
            type="text"
            name="supplier"
            id="supplier"
            maxlength="100"
            placeholder="Supplier name"
            required
        >
    </label>

    <label class="form-field">
        Unit price (UGX)
        <input
            type="number"
            name="unit_price"
            id="unit_price"
            min="0"
            step="0.01"
            placeholder="0.00"
            required
        >
    </label>

    <label class="form-field">
        Quantity in stock
        <input
            type="number"
            name="quantity_in_stock"
            id="quantity_in_stock"
            min="0"
            step="1"
            placeholder="0"
            required
        >
    </label>

    <label class="form-field">
        Reorder level
        <input
            type="number"
            name="reorder_level"
            id="reorder_level"
            min="0"
            step="1"
            placeholder="0"
            required
        >
    </label>
</div>
